<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Inner card accent -->
  <rect x="56" y="56" width="400" height="400" rx="80" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" />
  
  <!-- Graduation Cap / Book / Currency Emblem -->
  <g filter="url(#shadow)" transform="translate(96, 110)">
    <!-- Academic Cap -->
    <path d="M160 30 L300 100 L160 170 L20 100 Z" fill="#ffffff" />
    <path d="M70 135 V200 C70 240 250 240 250 200 V135" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M280 115 V190 C280 205 270 215 260 215" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" />
    <circle cx="260" cy="218" r="8" fill="#93c5fd" />
    
    <!-- Ledger / Currency Card Below Cap -->
    <rect x="30" y="190" width="260" height="90" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#60a5fa" stroke-width="6"/>
    <!-- Rupee / Currency Symbol in Ledger -->
    <text x="160" y="252" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" text-anchor="middle">₹</text>
  </g>
</svg>
